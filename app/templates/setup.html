<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إعداد النظام - موزع الجداول الذكي</title>
    <style>
        body { font-family: 'Tajawal', 'Cairo', sans-serif; background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .setup-container { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; border-top: 5px solid #27ae60; }
        h2 { color: #2c3e50; margin-bottom: 10px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 25px; line-height: 1.6; }
        .input-group { margin-bottom: 20px; text-align: right; }
        .input-group label { display: block; margin-bottom: 8px; color: #555; font-weight: bold; font-size: 14px; }
        .input-group input { width: 100%; padding: 10px 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; font-family: inherit; box-sizing: border-box; }
        .btn-setup { width: 100%; padding: 12px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: background 0.3s; }
        .btn-setup:hover { background: #219653; }
        #msg-box { margin-top: 15px; display: none; font-size: 14px; font-weight: bold; padding: 10px; border-radius: 6px; }
        .error { background: #fadbd8; color: #c0392b; border: 1px solid #f5b7b1; }
        .success { background: #d5f5e3; color: #27ae60; border: 1px solid #abebc6; }
    </style>
</head>
<body>

<div class="setup-container">
    <h2>🚀 مرحباً بك في موزع الجداول</h2>
    <p>يبدو أن هذه هي المرة الأولى لتشغيل النظام. يرجى إعداد حساب المدير الخاص بك للبدء في استخدام البرنامج.</p>
    
    <div class="input-group">
        <label>اختر اسم مستخدم (للدخول):</label>
        <input type="text" id="setup-username" placeholder="مثال: admin">
    </div>
    <div class="input-group">
        <label>اختر كلمة مرور قوية:</label>
        <input type="password" id="setup-password" placeholder="أدخل كلمة المرور...">
    </div>
    <button class="btn-setup" onclick="setupAdmin()">حفظ والبدء</button>
    <div id="msg-box"></div>
</div>

<script>
    function setupAdmin() {
        const user = document.getElementById('setup-username').value;
        const pass = document.getElementById('setup-password').value;
        const msgBox = document.getElementById('msg-box');
        
        if(!user || !pass) {
            msgBox.className = 'error';
            msgBox.innerText = 'يرجى إدخال اسم المستخدم وكلمة المرور.';
            msgBox.style.display = 'block';
            return;
        }

        fetch('/setup', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({username: user, password: pass})
        })
        .then(res => res.json())
        .then(data => {
            if(data.success) {
                msgBox.className = 'success';
                msgBox.innerText = '✅ تم الإعداد بنجاح! جاري التوجيه لصفحة الدخول...';
                msgBox.style.display = 'block';
                // توجيه لصفحة الدخول بعد ثانية ونصف
                setTimeout(() => window.location.href = '/login', 1500);
            } else {
                msgBox.className = 'error';
                msgBox.innerText = data.error;
                msgBox.style.display = 'block';
            }
        }).catch(err => {
            msgBox.className = 'error';
            msgBox.innerText = 'حدث خطأ في الاتصال بالخادم.';
            msgBox.style.display = 'block';
        });
    }
</script>

</body>
</html>
